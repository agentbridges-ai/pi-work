# Codex local environment for Piwork worktrees.
version = 1
name = "Piwork"

[setup]
script = """
set -euo pipefail
make install
make agent-browser
"""

[cleanup]
script = """
set -euo pipefail
make dev-fast-stop
make clean-runtime
"""

[[actions]]
name = "启动开发环境"
icon = "run"
command = "make dev"

[[actions]]
name = "停止开发环境"
icon = "tool"
command = "make dev-fast-stop"

[[actions]]
name = "查看服务状态"
icon = "tool"
command = "make status"

[[actions]]
name = "快速检查"
icon = "test"
command = "make check"

[[actions]]
name = "运行目标测试"
icon = "test"
command = "make test-targeted"

[[actions]]
name = "类型检查"
icon = "test"
command = "make typecheck"

[[actions]]
name = "构建前端"
icon = "run"
command = "make build"

[[actions]]
name = "完整验证"
icon = "test"
command = "make verify"
