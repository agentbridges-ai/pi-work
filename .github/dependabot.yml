version: 2
updates:
  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
      day: monday
    groups:
      patch-and-minor:
        update-types: [patch, minor]
    ignore:
      # Piwork's native Runtime and SRT surface is intentionally pinned as a
      # coordinated compatibility set. Upgrade it only through an RFC and a
      # focused canary, never as an unrelated Dependabot batch.
      - dependency-name: "@anthropic-ai/sandbox-runtime"
      - dependency-name: "@earendil-works/pi-ai"
      - dependency-name: "@earendil-works/pi-coding-agent"
      - dependency-name: "@modelcontextprotocol/sdk"
  - package-ecosystem: bun
    directory: /landing-page
    schedule:
      interval: weekly
      day: monday
    groups:
      patch-and-minor:
        update-types: [patch, minor]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      action-patches:
        update-types: [patch, minor]
