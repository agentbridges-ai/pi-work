name: verify

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ONLYOFFICE_INTEGRATION_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      ONLYOFFICE_INTEGRATION_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain

      - name: Install frozen dependencies
        run: make install

      - name: Check formatting
        run: make format-check

      - name: Lint maintained source
        run: make lint

      - name: Check types and dead code
        run: make typecheck deadcode

      - name: Check duplication
        run: make dry-check

      - name: Run the critical test suite
        # Pi RPC/SRT changes have their own required Linux canary. Keeping the
        # contract probe there prevents this fast lane from doing the same work.
        run: make verify-actions-pinning verify-onlyoffice-release verify-pi-only-runtime test-targeted

      - name: Build the production frontend
        run: make build

  better-auth-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: piwork
          POSTGRES_PASSWORD: piwork
          POSTGRES_DB: piwork_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U piwork -d piwork_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: "3457"
      VITE_PORT: "3458"
      PIWORK_E2E_DATABASE_URL: postgres://piwork:piwork@127.0.0.1:5432/piwork_e2e
      BETTER_AUTH_SECRET: piwork-e2e-secret-that-is-longer-than-thirty-two-characters
      BETTER_AUTH_URL: http://127.0.0.1:3457
      PIWORK_RUNTIME_MODE: local
      PIWORK_SERVE_FRONTEND: "0"
      PIWORK_RECORD: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-toolchain

      - name: Install frozen dependencies
        run: make install

      - name: Restore pinned Playwright Chromium
        id: playwright-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Install pinned Playwright Chromium
        run: cd web && bunx playwright install --with-deps chromium

      - name: Run isolated Better Auth E2E with migrations, API, Vite, and Chromium
        run: make test-e2e

      - name: Upload Playwright diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-better-auth-${{ github.run_id }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 14
