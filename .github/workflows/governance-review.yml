name: governance review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

concurrency:
  group: governance-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Verify trusted governance baseline
        run: node scripts/governance/check-governance.mjs
