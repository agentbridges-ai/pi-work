name: deep verify

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/deep-verify.yml"
      - ".github/actions/setup-toolchain/action.yml"
      - "Makefile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "release/**"
      - "scripts/ensure-agent-browser.sh"
      - "scripts/pi-reset-legacy-sessions.sh"
      - "scripts/verify-agent-browser-release.mjs"
      - "scripts/verify-github-actions-pinning.mjs"
      - "scripts/verify-native-pi-dependencies.mjs"
      - "scripts/verify-onlyoffice-release.mjs"
      - "scripts/verify-pi-only-runtime.sh"
      - "scripts/verify-toolchain.sh"
      - "web/bun.lock"
      - "web/package.json"
      - "web/scripts/check-ui-bundle-budgets.mjs"
      - "web/scripts/pi-rpc-probe.ts"
      - "web/scripts/verify-pi-rpc-contract.ts"
      - "web/scripts/verify-srt-pi-rpc.ts"
      - "web/scripts/verify-srt-user-space-transport.ts"
  schedule:
    - cron: "20 18 * * *"
  workflow_dispatch:
    inputs:
      onlyoffice_candidate_integration:
        description: Run the explicit candidate-only online integration gate on the selected ref
        required: true
        default: false
        type: boolean
      onlyoffice_candidate_release_id:
        description: Exact immutable OnlyOffice releaseId expected on the selected ref
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      srt: ${{ steps.classify.outputs.srt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          # Scheduled and manually-dispatched runs are intentional full probes.
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "srt=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$PR_BASE_SHA"
          if [[ "$EVENT_NAME" == "push" ]]; then base="$PUSH_BEFORE_SHA"; fi
          # A repository's first push has GitHub's all-zero before SHA. Diff it
          # from the empty tree instead of failing the named deep-verify check.
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git hash-object -t tree /dev/null)"
          fi
          changed="$(git diff --name-only "$base" "$GITHUB_SHA")"
          if grep -Eq '^(\.github/workflows/srt-linux\.yml|\.github/actions/setup-toolchain/action\.yml|Makefile|scripts/(verify-native-pi-dependencies\.mjs|verify-pi-only-runtime\.sh)|web/(bin/user-space\.ts|bun\.lock|package\.json|scripts/(pi-rpc-probe\.ts|verify-pi-rpc-contract\.ts|verify-srt-pi-rpc\.ts|verify-srt-isolation\.ts|verify-srt-user-space-transport\.ts)|server/(network-security\.ts|path-resolver\.ts|pi-bootstrap-channel\.ts|pi-rpc-contract\.ts|pi-rpc-transport\.ts|pi-[^/]+\.ts|managed-mcp\.ts|srt-policy\.ts)|src/user-space-shell-contract\.ts))$' <<<"$changed"; then
            echo "srt=true" >> "$GITHUB_OUTPUT"
          else
            echo "srt=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ONLYOFFICE_INTEGRATION_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      ONLYOFFICE_INTEGRATION_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain

      - name: Install PostgreSQL and SRT runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap postgresql-client-16 ripgrep socat

      - name: Enable capability-bearing user namespaces for SRT
        run: |
          if [[ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = "0"
          fi

      - name: Resolve the pull request coverage range
        if: ${{ github.event_name == 'pull_request' }}
        id: coverage-range
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
        run: |
          head="$(git rev-parse HEAD)"
          git cat-file -e "${head}^{commit}"
          if [[ "$head" != "$EXPECTED_CHECKOUT_SHA" ]]; then
            echo "Checked-out commit $head does not match event commit $EXPECTED_CHECKOUT_SHA" >&2
            exit 1
          fi
          base="$(git rev-parse "${head}^1")"
          pr_head="$(git rev-parse "${head}^2")"
          if git rev-parse "${head}^3" >/dev/null 2>&1; then
            echo "Expected a two-parent synthetic PR merge commit: $head" >&2
            exit 1
          fi
          if [[ "$base" != "$PR_BASE_SHA" || "$pr_head" != "$PR_HEAD_SHA" ]]; then
            echo "Synthetic merge parents do not match PR base/head: $base $pr_head" >&2
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Run the complete verification suite
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.onlyoffice_candidate_integration != true }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Linux SRT owns the native RPC/SRT canaries whenever its protected
        # surface changes; deep verification still runs its portable suite and
        # coverage once.
        run: make verify VERIFY_SRT=${{ needs.changes.outputs.srt == 'true' && '0' || '1' }} ONLYOFFICE_RELEASE_VERIFY_ARGS=--online

      - name: Run the complete verification suite for an explicit candidate integration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.onlyoffice_candidate_integration == true }}
        run: make verify ONLYOFFICE_RELEASE_VERIFY_ARGS=--allow-candidate

      - name: Enforce pull request diff coverage
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          make coverage-diff \
            COVERAGE_BASE_SHA="${{ steps.coverage-range.outputs.base }}" \
            COVERAGE_HEAD_SHA="${{ steps.coverage-range.outputs.head }}"

      - name: Upload Vitest coverage
        if: ${{ always() && hashFiles('web/coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: vitest-coverage-${{ github.run_id }}
          path: web/coverage
          if-no-files-found: error
          retention-days: 14

  onlyoffice-candidate-integration:
    name: OnlyOffice candidate integration / ${{ inputs.onlyoffice_candidate_release_id }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.onlyoffice_candidate_integration == true }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain

      - name: Verify the selected candidate release and HEAD online
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ONLYOFFICE_EXPECTED_RELEASE_ID: ${{ inputs.onlyoffice_candidate_release_id }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          test -n "${ONLYOFFICE_EXPECTED_RELEASE_ID}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          candidate_base_sha="$(git rev-parse refs/remotes/origin/main)"
          ONLYOFFICE_INTEGRATION_EVENT_BASE_SHA="${candidate_base_sha}" \
            ONLYOFFICE_INTEGRATION_EVENT_HEAD_SHA="${EXPECTED_HEAD_SHA}" \
            make verify-onlyoffice-release \
            ONLYOFFICE_RELEASE_VERIFY_ARGS="--online --allow-candidate --candidate-integration"
