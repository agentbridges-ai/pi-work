name: governance review

run-name: governance-review:${{ github.event_name }}:${{ github.event.action || 'none' }}:${{ github.actor }}

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  pull_request_review:
    types: [submitted, dismissed, edited]

concurrency:
  group: governance-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

jobs:
  governance-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Never execute governance code from a PR-controlled base branch.
          # The default branch is the only trusted governance source.
          ref: refs/heads/main
          persist-credentials: false
      - name: Governance review no-op for merge group
        if: ${{ github.event_name == 'merge_group' }}
        run: echo "merge_group has no pull_request metadata; author-aware governance review was required before queue admission."
      - name: Verify Leader participation for high-risk paths
        if: ${{ github.event_name != 'merge_group' }}
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          PIWORK_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          # The checkout is always the trusted default branch. During the
          # governance bootstrap that branch may predate this script, so
          # report a controlled no-op instead of producing a missing-module
          # failure. After the baseline merges, run the full metadata check.
          if [[ -f scripts/governance/leader-review.mjs ]]; then
            node scripts/governance/leader-review.mjs
          else
            echo "Governance baseline is not present on trusted main; controlled bootstrap no-op."
          fi
