name: governance

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Record merge-group metadata boundary
        if: ${{ github.event_name == 'merge_group' }}
        run: echo "merge_group has no pull_request metadata; governance checks use the synthetic queue commit."
      - name: Verify governance baseline
        run: make governance-check
      - name: Verify production security configuration checks
        run: node scripts/governance/security-config-check.mjs
