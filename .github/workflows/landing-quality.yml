name: landing quality

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "landing-page/**"
      - "scripts/governance/landing-check.mjs"
      - ".github/workflows/landing-quality.yml"
  workflow_dispatch:

concurrency:
  group: landing-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  landing-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-toolchain
      - name: Run frozen Landing install, lint, typecheck, build, and route smoke
        run: make landing-check
