name: landing quality

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    paths:
      - "landing-page/**"
      - "scripts/governance/landing-check.mjs"
      - ".github/workflows/landing-quality.yml"
      - ".github/actions/setup-toolchain/action.yml"
      - "mise.toml"
      - "mise.lock"
  workflow_dispatch:

concurrency:
  group: landing-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  landing-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - name: Record merge-group metadata boundary
        if: ${{ github.event_name == 'merge_group' }}
        run: echo "merge_group has no pull_request metadata; landing quality uses the synthetic queue commit."
      - name: Run frozen Landing install, lint, typecheck, build, and route smoke
        run: make landing-check
