name: governance bootstrap audit

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
    paths:
      - ".governance/github-policy.json"
      - ".github/workflows/governance-bootstrap-audit.yml"
      - "scripts/governance/bootstrap-audit.mjs"
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

concurrency:
  group: governance-bootstrap-audit-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: read

jobs:
  governance-bootstrap-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted governance base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
          fetch-depth: 1
      - name: Audit Leader-only Bootstrap and remote readback
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: node scripts/governance/bootstrap-audit.mjs
