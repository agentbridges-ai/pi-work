name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "landing-page/**"
      - "bun.lock"
      - ".github/workflows/deploy.yml"
      - ".github/actions/setup-toolchain/action.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Deployment lane; production is accepted only from main
        required: true
        default: candidate
        type: choice
        options: [candidate, production]

concurrency:
  group: cloudflare-pages-${{ github.event_name == 'push' && 'production' || inputs.target }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ github.event_name == 'push' && 'pages-production' || format('pages-{0}', inputs.target) }}
    env:
      DEPLOY_TARGET: ${{ github.event_name == 'push' && 'production' || inputs.target }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-toolchain

      - name: Require the committed landing lockfile and an allowed production ref
        run: |
          test -f bun.lock
          if [[ "$DEPLOY_TARGET" == "production" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production Pages deployments must run from refs/heads/main." >&2
            exit 1
          fi

      - name: Install frozen landing dependencies
        run: bun install --frozen-lockfile --filter piwork-landing-page

      - name: Build static site
        run: bun run --cwd landing-page build

      - name: Deploy candidate
        if: ${{ env.DEPLOY_TARGET == 'candidate' }}
        id: candidate
        run: |
          output="$(bunx --no-install wrangler pages deploy landing-page/out \
            --project-name=getpi-work --branch="candidate-${GITHUB_RUN_ID}" 2>&1 | tee /dev/stderr)"
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.pages\.dev' | tail -1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Deploy production
        if: ${{ env.DEPLOY_TARGET == 'production' }}
        id: production
        run: |
          output="$(bunx --no-install wrangler pages deploy landing-page/out \
            --project-name=getpi-work --branch=main 2>&1 | tee /dev/stderr)"
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.pages\.dev' | tail -1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Accept the deployed Pages response
        env:
          DEPLOY_URL: ${{ steps.candidate.outputs.url || steps.production.outputs.url }}
        run: |
          # Wrangler exits non-zero on an API error. Re-fetch the immutable
          # deployment URL before accepting either the candidate or production.
          test -n "$DEPLOY_URL"
          curl --fail --show-error --silent --location --retry 4 --retry-all-errors "$DEPLOY_URL" >/dev/null
