name: Deploy to Cloudflare Pages

on:
  pull_request:
    paths:
      - "package.json"
      - "landing-page/**"
      - "packages/design-tokens/**"
      - "packages/ui/**"
      - "packages/ui-patterns/**"
      - ".github/workflows/deploy.yml"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "landing-page/**"
      - "packages/design-tokens/**"
      - "packages/ui/**"
      - "packages/ui-patterns/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('landing-pr-{0}', github.event.pull_request.number) || 'landing-production' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      # PR validation must never claim the production environment. Keeping the
      # build in the same job preserves a deterministic deploy status while
      # isolating its concurrency group from main-branch deployment.
      name: ${{ github.event_name == 'pull_request' && 'landing-pr' || 'production' }}
      url: ${{ github.event_name == 'pull_request' && github.event.pull_request.html_url || 'https://getpi.work' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        working-directory: landing-page
        run: bun install --frozen-lockfile --backend copyfile --linker isolated

      - name: Lint with zero warnings
        working-directory: landing-page
        run: bun run lint -- --max-warnings=0

      - name: Typecheck
        working-directory: landing-page
        run: bun x tsc --noEmit

      - name: Build static site
        working-directory: landing-page
        run: bun run build

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        working-directory: landing-page
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test production landing
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors https://getpi.work/
