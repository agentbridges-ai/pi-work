name: Deploy to Cloudflare Pages

on:
  pull_request:
    paths:
      - "package.json"
      - "landing-page/**"
      - "landing-page/bun.lock"
      - "packages/design-tokens/**"
      - "packages/ui/**"
      - "packages/ui-patterns/**"
      - ".github/workflows/deploy.yml"
      - ".github/actions/setup-toolchain/action.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "landing-page/**"
      - "landing-page/bun.lock"
      - "packages/design-tokens/**"
      - "packages/ui/**"
      - "packages/ui-patterns/**"
      - ".github/workflows/deploy.yml"
      - ".github/actions/setup-toolchain/action.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Deployment lane; production is accepted only from main
        required: true
        default: candidate
        type: choice
        options: [candidate, production]

concurrency:
  group: cloudflare-pages-${{ github.event_name == 'push' && 'production' || github.event_name == 'workflow_dispatch' && inputs.target || 'verify' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ github.event_name == 'push' && 'pages-production' || github.event_name == 'workflow_dispatch' && format('pages-{0}', inputs.target) || 'pages-preview' }}
    env:
      DEPLOY_TARGET: ${{ github.event_name == 'push' && 'production' || github.event_name == 'workflow_dispatch' && inputs.target || 'verify' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-toolchain

      - name: Require the committed landing lockfile and an allowed production ref
        run: |
          test -f landing-page/bun.lock
          if [[ "$DEPLOY_TARGET" == "production" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production Pages deployments must run from refs/heads/main." >&2
            exit 1
          fi

      - name: Install frozen landing dependencies
        working-directory: landing-page
        run: bun install --backend copyfile --linker isolated --frozen-lockfile

      - name: Lint landing page
        working-directory: landing-page
        run: bun run lint -- --max-warnings=0

      - name: Typecheck landing page
        working-directory: landing-page
        run: bun x tsc --noEmit

      - name: Build static site
        working-directory: landing-page
        run: bun run build

      - name: Deploy candidate
        if: ${{ github.event_name == 'workflow_dispatch' && env.DEPLOY_TARGET == 'candidate' }}
        id: candidate
        working-directory: landing-page
        run: |
          output="$(bunx --no-install wrangler pages deploy out \
            --project-name=getpi-work --branch="candidate-${GITHUB_RUN_ID}" 2>&1 | tee /dev/stderr)"
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.pages\.dev' | tail -1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Deploy production
        if: ${{ env.DEPLOY_TARGET == 'production' }}
        id: production
        working-directory: landing-page
        run: |
          output="$(bunx --no-install wrangler pages deploy out \
            --project-name=getpi-work --branch=main 2>&1 | tee /dev/stderr)"
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.pages\.dev' | tail -1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Accept the deployed Pages response
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DEPLOY_URL: ${{ steps.candidate.outputs.url || steps.production.outputs.url }}
        run: |
          test -n "$DEPLOY_URL"
          curl --fail --show-error --silent --location --retry 4 --retry-all-errors "$DEPLOY_URL" >/dev/null
