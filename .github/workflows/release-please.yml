name: release please

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Create or update the Piwork release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # GITHUB_TOKEN intentionally cannot trigger another workflow from the
      # release event it creates. Generate evidence in this same trusted run so
      # releases never depend on a suppressed release-created event.
      - name: Checkout the published release tag
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.release.outputs.tag_name }}
          fetch-depth: 1

      - name: Generate release evidence
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ steps.release.outputs.sha }}
          REQUIRED_CHECK_URLS: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/governance/release-evidence.mjs --output release-evidence.json

      - name: Export SPDX dependency graph
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "/repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" > sbom.spdx.json

      - name: Upload release evidence and SBOM
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: piwork-release-evidence-${{ steps.release.outputs.tag_name }}
          path: |
            release-evidence.json
            sbom.spdx.json
          if-no-files-found: error
          retention-days: 365
