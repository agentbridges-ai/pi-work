name: Set up Piwork toolchain
description: Install Piwork's pinned development toolchain with mise

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      env:
        # .tool-versions retains the external PostgreSQL client baseline, but
        # must not expand the CI Bun/Node install set.
        MISE_OVERRIDE_TOOL_VERSIONS_FILENAMES: none
      with:
        version: 2026.8.2
        install_args: bun node
        cache: true

    - name: Keep mise toolset independent from legacy pins
      shell: bash
      run: echo "MISE_OVERRIDE_TOOL_VERSIONS_FILENAMES=none" >> "$GITHUB_ENV"

    # SRT needs a private copyfile node_modules installation, so cache only
    # Bun's immutable package downloads rather than the installed tree.
    - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.bun/install/cache
        # Rotate once after a corrupted immutable tarball was observed in the
        # old key. The lockfile and toolchain still provide the cache identity;
        # the suffix prevents reusing that damaged archive on every job.
        key: bun-v3-${{ runner.os }}-${{ hashFiles('mise.toml', 'mise.lock', 'web/bun.lock', 'landing-page/bun.lock') }}

    - name: Verify CI toolchain pins
      shell: bash
      env:
        MISE_OVERRIDE_TOOL_VERSIONS_FILENAMES: none
      run: |
        expected_node="$(MISE_OVERRIDE_TOOL_VERSIONS_FILENAMES=none mise config get tools.node --raw)"
        expected_bun="$(MISE_OVERRIDE_TOOL_VERSIONS_FILENAMES=none mise config get tools.bun --raw)"
        actual_node="$(node --version | sed 's/^v//')"
        actual_bun="$(bun --version)"
        test -n "$expected_node"
        test -n "$expected_bun"
        test "$actual_node" = "$expected_node"
        test "$actual_bun" = "$expected_bun"
