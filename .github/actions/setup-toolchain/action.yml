name: Set up Piwork toolchain
description: Install the single Node.js and Bun versions used by every CI job

inputs:
  node-version:
    description: Exact Node.js version
    required: false
    default: 26.5.0
  bun-version:
    description: Exact Bun version
    required: false
    default: 1.3.9

runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: ${{ inputs.node-version }}

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Verify CI toolchain pins
      shell: bash
      run: |
        expected_node="$(awk '$1 == "nodejs" { print $2; exit }' .tool-versions)"
        expected_bun="$(awk '$1 == "bun" { print $2; exit }' .tool-versions)"
        actual_node="$(node --version | sed 's/^v//')"
        actual_bun="$(bun --version)"
        test -n "$expected_node"
        test -n "$expected_bun"
        test "$actual_node" = "$expected_node"
        test "$actual_bun" = "$expected_bun"
