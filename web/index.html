<!doctype html>
<html lang="zh-CN" class="light bg-background" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="description" content="派活" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="application-name" content="派活" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>派活</title>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var mode = localStorage.getItem("piwork-theme-mode");
          if (mode !== "light" && mode !== "dark" && mode !== "system") {
            mode = localStorage.getItem("piwork-dark-mode") === "true" ? "dark" : "system";
          }
          var systemDark =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = mode === "dark" || (mode === "system" && systemDark) ? "dark" : "light";
          localStorage.removeItem("piwork-design-radius");
          root.classList.remove("light", "dark");
          root.classList.add(theme);
          root.dataset.theme = theme;
          root.removeAttribute("data-design-theme");
          root.removeAttribute("data-design-radius");
          root.style.colorScheme = theme;
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) {
            themeColor.setAttribute("content", theme === "dark" ? "#242424" : "#FFFFFF");
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
